const CATS3=[["flowerG","Flower","g"],["joints","Pre-rolls",""],["edibles","Edibles",""]];
function trackHTML(purchased,tt,only){ return CATS3.filter(c=>!only||only.includes(c[0])).map(([k,l,u])=>{ const P=purchased[k],c=tt.collected[k],s=tt.scheduled[k],r=tt.remaining[k],pc=v=>P?v/P*100:0; return `<div class="track"><div class="lab"><span>${l}</span><span>${r}${u} remaining</span></div><div class="bar" role="img" aria-label="${l}: ${P}${u} purchased, ${c}${u} collected, ${s}${u} scheduled, ${r}${u} remaining"><i class="c" style="width:${pc(c)}%"></i><i class="s" style="width:${pc(s)}%"></i></div><div class="legend"><span>Collected ${c}${u}</span><span class="s">Scheduled ${s}${u}</span><span class="r">Remaining ${r}${u}</span><span style="margin-left:auto;color:var(--tx)">${P}${u} purchased</span></div></div>`; }).join(""); }

  commit(true); }
 else if(kind==="a2-prod"){ if(!can("catalogue.edit")) return; const name=(fd.name||"").trim(); if(!name) return fail("pd-e","Enter a name."); const vars=[]; for(let i=0;i<10&&("vl"+i) in fd;i++){ const l=(fd["vl"+i]||"").trim(),p=fd["vp"+i]; if(l||p!=="") vars.push({i,label:l||"Standard",price:num(p)}); } btn.disabled=true;

  commit(true); }
 else if(kind==="a2-rules"){ if(!can("pricing.edit")) return; const out={}; let bad=null; priceCombos().forEach(([ff,fl,g])=>{ const u=num(fd[`u|${ff}|${g}`]),bq=num(fd[`bq|${ff}|${g}`]),bp=num(fd[`bp|${ff}|${g}`]),r=rule(ff,g); if((bq==null)!==(bp==null)) bad=`${fl} · ${g}: enter both a bundle size and a bundle price, or neither.`; if(bq!=null&&bq<2) bad=`${fl} · ${g}: a bundle must be 2 or more.`; const needs=(ff==="flower"&&["Outdoor","Greenhouse","Greendoor"].includes(g))||(ff==="preroll"&&g==="Greenhouse"); if(needs&&u==null&&bq==null) bad=`${fl} · ${g} needs a price because packages and subscriptions use it.`; if(u==null&&bq!=null&&r&&bq!==r.step&&r.step>1) bad=`${fl} · ${g}: with no per-unit price the bundle must be ${r.step}.`; (out[ff]=out[ff]||{})[g]={unit:u,bundles:bq!=null?[[bq,bp]]:[]}; }); if(bad) return fail("rl-e",bad); btn.disabled=true; OV.rules=out; audit("pricing.rules","Grade prices","updated"); commit(true); }
 else if(kind==="a2-costs"){ if(!can("pricing.edit")) return; const fl={}; ["Outdoor","Greenhouse","Greendoor","Premium Indoor","Top Shelf"].forEach(g=>{ const v=num(fd["fl|"+g]); if(v!=null) fl[g]=v; }); OV.cost={flower:fl,preroll:num(fd.preroll),edPct:num(fd.edPct)}; audit("pricing.costs","Costs","updated"); commit(false,"Costs saved"); }
 else if(kind==="a2-disc"){ if(!can("pricing.edit")) return; const d={Solo:num(fd.Solo,0),Session:num(fd.Session,0),Party:num(fd.Party,0)}; if(Object.values(d).some(v=>v<0||v>50)) return fail("dc-e","Discounts must be between 0 and 50%."); OV.cfg.pkgDiscount=d; OV.cfg.createMin=num(fd.createMin,250); OV.cfg.edibleRef=num(fd.edibleRef,70); btn.disabled=true; audit("pricing.tiers","Tier discounts",`${d.Solo}/${d.Session}/${d.Party}%`); commit(true); }
 else if(kind==="a2-pkg"){ if(!can("pricing.edit")) return; const fid=f.dataset.fid,t=f.dataset.t,al={}; let bad=false; const pr=num(fd.price,0); Object.keys(fd).forEach(k=>{ if(k==="price") return; const v=Math.floor(+fd[k]); if(!(v>=1)){ bad=true; return; } if(k.startsWith("f|")){ (al.f=al.f||{})[k.slice(2)]=v; } else al[k]=v; }); if(bad) return fail("pg-e","Quantities must be 1 or more."); btn.disabled=true;
  (OV.alloc[fid]=OV.alloc[fid]||{})[t]=al; if(pr>0) OV.pk[id]={price:pr}; else delete OV.pk[id]; audit("pricing.package",PK[id].name,pr>0?money(pr):"auto price"); commit(true); }
 else if(kind==="a2-plan"){ if(!can("pricing.edit")) return; const p=PLB[id],o={price:num(fd.price),flowerG:num(fd.flowerG),joints:num(fd.joints),edibles:num(fd.edibles),tag:(fd.tag||"").trim()}; if([o.price,o.flowerG,o.joints,o.edibles].some(v=>!(v>=1))) return fail("pl-e","All numbers must be 1 or more."); btn.disabled=true; OV.plans[p.name]=o; audit("pricing.plan",p.name,money(o.price)); commit(true); }
 else if(kind==="a2-event"){ if(!can("events.manage")) return; const title=(fd.title||"").trim(); if(!title||!fd.date) return fail("ev-e","Add a title and a date."); const eid=id||uid("e"),o={id:eid,title,date:fd.date,time:fd.time||"",venue:fd.venue||"",price:fd.price||"",desc:fd.desc||"",hidden:!!fd.hidden}; btn.disabled=true; if(!await photo("ev-"+eid,"ev-e")) return; const i=OV.events.findIndex(x=>x.id===eid); if(i>=0) OV.events[i]=o; else OV.events.push(o); audit(id?"event.edit":"event.add",title,fd.date); commit(false,"Event saved"); }
 else if(kind==="a2-merch"){ if(!can("events.manage")) return; const name=(fd.name||"").trim(); if(!name) return fail("mc-e","Add a name."); const mid=id||uid("m"),o={id:mid,name,price:num(fd.price),sizes:fd.sizes||"",desc:fd.desc||"",hidden:!!fd.hidden}; btn.disabled=true; if(!await photo("mc-"+mid,"mc-e")) return; const i=OV.merch.findIndex(x=>x.id===mid); if(i>=0) OV.merch[i]=o; else{ OV.merch.push(o); if(fd.qty!==""&&fd.qty!=null){ (ST.stock=ST.stock||{})["merch|"+mid]={qty:Math.max(0,Math.floor(+fd.qty))}; save(); } } audit(id?"merch.edit":"merch.add",name,""); commit(false,"Item saved"); }
 else if(kind==="a2-biz"){ if(!can("business.edit")) return; if(fd.email&&!/^\S+@\S+\.\S+$/.test(fd.email)) return fail("bz-e","That email doesn’t look right."); const hours=DAYS.map((d,i)=>fd["open"+i]?[+fd["from"+i],+fd["to"+i]]:null); if(hours.some(h=>h&&h[1]<=h[0])) return fail("bz-e","Closing time must be after opening time."); btn.disabled=true;

 else if(kind==="a2-member"){ if(!can("members.edit")) return; const a=ST.accounts[id]; if(!a||!canEdit(ME(),a)) return; const nm=(fd.name||"").trim(),p=normPhone(fd.phone); if(!nm) return fail("mm-e","Enter a name."); if(!p) return fail("mm-e","Enter a valid mobile number."); if(Object.values(ST.accounts).some(x=>x.id!==id&&x.phone===p)) return fail("mm-e","Another account already uses that number."); if(fd.dob&&ageOf(fd.dob)<18) return fail("mm-e","Members must be 18 or older."); const ch=[]; if(a.name!==nm) ch.push("name"); if(a.phone!==p) ch.push("mobile"); if((a.dob||"")!==(fd.dob||"")) ch.push("birthday"); a.name=nm; a.phone=p; a.dob=fd.dob||""; audit("member.edit",nm,ch.join(", ")||"no change"); closeDlg("dMod"); toast("Member updated"); refreshPage(); }
